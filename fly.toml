# fly.toml app configuration file generated for ping-search on 2026-06-29T12:24:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ping-search'
primary_region = 'arn'

[build]
  image = 'searxng/searxng:latest'

[env]
  SEARXNG_SETTINGS_PATH = '/etc/searxng/settings.yml'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = ''
  internal_port = 8080
  ports = []

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
